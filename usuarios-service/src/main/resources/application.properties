spring.application.name=usuarios-service
server.port=8081

# H2 en archivo: los datos se conservan al reiniciar el servicio
spring.datasource.url=jdbc:h2:file:./data/usuarios-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola de la base de datos: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console