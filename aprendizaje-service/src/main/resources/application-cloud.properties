# Puerto asignado por la plataforma de alojamiento.
server.port=${PORT:10000}
server.address=0.0.0.0

# Base de datos PostgreSQL.
spring.datasource.url=${MPAZ_DB_URL}
spring.datasource.username=${MPAZ_DB_USER}
spring.datasource.password=${MPAZ_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de persistencia.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Limita las conexiones simultaneas.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Desactiva la consola H2.
spring.h2.console.enabled=false

# Clave compartida para validar los JWT.
mpaz.jwt.secret=${MPAZ_JWT_SECRET}