spring.application.name=aprendizaje-service
server.port=8082

# Base de datos H2 independiente y persistente.
spring.datasource.url=jdbc:h2:file:./data/aprendizaje-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de persistencia JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Desactiva el acceso web a la consola H2.
spring.h2.console.enabled=false

# Clave compartida para validar los JWT de usuarios-service.
mpaz.jwt.secret=${MPAZ_JWT_SECRET}